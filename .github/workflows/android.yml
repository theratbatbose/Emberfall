# Builds the Android app (APK) and publishes it as a GitHub Release you can
# download straight onto your phone.
name: Android app (APK)

on:
  push:
    branches: [claude/liferpg-app-build-qiwqdj, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "Emberfall-$VERSION.apk"
          gh release create "v$VERSION" "Emberfall-$VERSION.apk" \
            --target "${{ github.sha }}" \
            --title "Emberfall $VERSION" \
            --notes "Android build of Emberfall. On your phone: download Emberfall-$VERSION.apk below, open it, and allow installing from your browser if asked. Installing a newer version keeps your save." \
            --latest
